<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="840" height="430" fill="#FFFFFF"/>
<text x="420" y="26" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1A202C">paretoinfer workflow: evaluate where the boxes are widest until every alternative is certified</text>
<rect x="20" y="60" width="190" height="64" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="115.0" y="78.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">pareto_design()</text>
<text x="115.0" y="99.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">alternatives, objectives,</text>
<text x="115.0" y="114.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">epsilon, alpha, budget</text>
<rect x="250" y="60" width="190" height="64" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="345.0" y="78.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">initialize_pareto()</text>
<text x="345.0" y="99.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">boxes at the bounds,</text>
<text x="345.0" y="114.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">everything plausible</text>
<rect x="480" y="60" width="190" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="575.0" y="78.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1A202C">choose_next_evaluation()</text>
<text x="575.0" y="99.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">uncertain alternative with</text>
<text x="575.0" y="114.2" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">the widest box per cost</text>
<rect x="480" y="190" width="190" height="64" rx="8" fill="#EDF2F7" stroke="#4A5568" stroke-width="1.6"/>
<text x="575.0" y="208.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">evaluate</text>
<text x="575.0" y="229.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">noisy objective values,</text>
<text x="575.0" y="244.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">real or simulated</text>
<rect x="250" y="190" width="190" height="64" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="345.0" y="208.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">update_objectives()</text>
<text x="345.0" y="229.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">confidence sequences</text>
<text x="345.0" y="244.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">shrink the boxes</text>
<rect x="20" y="190" width="190" height="64" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="115.0" y="208.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">compute_sets()</text>
<text x="115.0" y="229.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">dominated, plausible,</text>
<text x="115.0" y="244.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">frontier; stopping reason</text>
<rect x="20" y="320" width="190" height="64" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="115.0" y="338.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">stop ?</text>
<text x="115.0" y="359.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">all certified, budget</text>
<text x="115.0" y="374.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">or max evaluations</text>
<rect x="250" y="320" width="190" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="345.0" y="338.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">pareto_report()</text>
<text x="345.0" y="359.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">three sets with certificates,</text>
<text x="345.0" y="374.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">cost, seeds, versions</text>
<rect x="480" y="320" width="190" height="64" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="575.0" y="338.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">autoplot()</text>
<text x="575.0" y="359.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">uncertain frontier:</text>
<text x="575.0" y="374.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">boxes coloured by status</text>
<polyline points="210,92 250,92" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="440,92 480,92" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="575,124 575,190" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="480,222 440,222" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="250,222 210,222" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="115,254 115,320" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="210,352 250,352" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="217.4" y="325.0" width="25.2" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="230.0" y="337.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">yes</text>
<polyline points="440,352 480,352" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="115,384 115,404" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<polyline points="115,404 730,404" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<polyline points="730,404 730,92" fill="none" stroke="#4A5568" stroke-width="1.8"/>
<rect x="740.0" y="239.5" width="88.1" height="17" rx="3" fill="#FFFFFF" fill-opacity="0.92"/>
<text x="784.0" y="251.8" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A5568">no: next round</text>
<polyline points="730,92 670,92" fill="none" stroke="#4A5568" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="420" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Running intersection keeps every box valid at every time: the sets never need a fixed sample size</text>
</svg>
