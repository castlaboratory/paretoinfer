url: https://castlaboratory.github.io/paretoinfer/

template:
  bootstrap: 5
  light-switch: true
  bslib:
    primary: "#1B7F79"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

development:
  mode: auto

authors:
  André Leite:
    href: https://castlab.org
  Raydonal Ospina:
    href: https://castlab.org
  Cristiano Ferraz:
    href: https://castlab.org

navbar:
