reference:
- title: Design and run an identification
  contents: [pareto_design, initialize_pareto, update_objectives, choose_next_evaluation, pareto_run]
- title: Results
  contents: [plausible_pareto_set, pareto_report, tidy.paretoinfer_state, glance.paretoinfer_state, autoplot.paretoinfer_state]
- title: Re-exports
  contents: [reexports]
articles:
- title: Get started
  navbar: ~
  contents: [paretoinfer]
- title: Studies
  navbar: Studies
  contents: [guarantee-and-cost, frontier-shapes]
- title: Practice
  navbar: Practice
  contents: [cost-and-budget]
