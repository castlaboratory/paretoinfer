<rect x="30" y="27.0" width="119" height="18" fill="#FFFFFF"/>
<text x="34" y="40.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1B7F79">Design and state</text>
<rect x="40" y="62" width="230" height="68" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="155.0" y="82.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">pareto_design()</text>
<text x="155.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">K alternatives, m objectives,</text>
<text x="155.0" y="118.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">bounds, epsilon, alpha, cost, budget</text>
<rect x="290" y="62" width="240" height="68" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="410.0" y="82.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">initialize_pareto()</text>
<text x="410.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">K x m confidence sequences,</text>
<text x="410.0" y="118.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">boxes start at the bounds</text>
<rect x="550" y="62" width="230" height="68" rx="8" fill="#E3F3F1" stroke="#1B7F79" stroke-width="1.6"/>
<text x="665.0" y="82.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">update_objectives()</text>
<text x="665.0" y="103.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">feeds evaluations, running</text>
<text x="665.0" y="118.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">intersection of the boxes</text>
<rect x="30" y="169.0" width="252" height="18" fill="#FFFFFF"/>
<text x="34" y="182.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6B4C9A">Sets with certificates (every time)</text>
<rect x="40" y="204" width="230" height="68" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="155.0" y="224.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">certified dominated</text>
<text x="155.0" y="245.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">U[j] &lt;= L[k] + epsilon</text>
<text x="155.0" y="260.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">on every objective</text>
<rect x="290" y="204" width="240" height="68" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="410.0" y="224.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">plausible Pareto set</text>
<text x="410.0" y="245.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">not certified dominated;</text>
<text x="410.0" y="260.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">certified optimal when proven</text>
<rect x="550" y="204" width="230" height="68" rx="8" fill="#EFEAF7" stroke="#6B4C9A" stroke-width="1.6"/>
<text x="665.0" y="224.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">estimated frontier</text>
<text x="665.0" y="245.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">point estimates among</text>
<text x="665.0" y="260.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">the plausible alternatives</text>
<rect x="30" y="311.0" width="182" height="18" fill="#FFFFFF"/>
<text x="34" y="324.2" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B7791F">Sampling rule and outputs</text>
<rect x="40" y="346" width="230" height="68" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="155.0" y="366.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">choose_next_evaluation()</text>
<text x="155.0" y="387.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">widest normalised box per</text>
<text x="155.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">unit cost among uncertain</text>
<rect x="290" y="346" width="240" height="68" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="410.0" y="366.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">pareto_run()</text>
<text x="410.0" y="387.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">choose, evaluate, update</text>
<text x="410.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">with a simulator until done</text>
<rect x="550" y="346" width="230" height="68" rx="8" fill="#FFF8E6" stroke="#B7791F" stroke-width="1.6"/>
<text x="665.0" y="366.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1A202C">pareto_report() and methods</text>
<text x="665.0" y="387.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">tidy, glance, autoplot:</text>
<text x="665.0" y="402.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2D3748">uncertain frontier with boxes</text>
