<text x="420" y="456" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#718096" font-style="italic">Confidence sequences come from seqbench (betting, empirical Bernstein, Hoeffding); alpha is split as alpha / (K m)</text>
