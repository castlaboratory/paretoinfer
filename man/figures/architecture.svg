<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A5568"/></marker></defs>
<rect width="820" height="470" fill="#FFFFFF"/>
<rect x="20" y="320" width="780" height="112" rx="12" fill="none" stroke="#B7791F" stroke-width="1.4" stroke-dasharray="7 5"/>
